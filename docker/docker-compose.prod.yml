version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: plumbingpro-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: plumbingpro
      POSTGRES_USER: plumb_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumb_user -d plumbingpro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plumbnet-prod
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    container_name: plumbingpro-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plumbnet-prod
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: production
    container_name: plumbingpro-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://plumb_user:${DB_PASSWORD}@postgres:5432/plumbingpro
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    networks:
      - plumbnet-prod
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: production
    container_name: plumbingpro-web-prod
    restart: always
    depends_on:
      - api
    networks:
      - plumbnet-prod

  nginx:
    image: nginx:1.27-alpine
    container_name: plumbingpro-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    networks:
      - plumbnet-prod

volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local

networks:
  plumbnet-prod:
    driver: bridge
