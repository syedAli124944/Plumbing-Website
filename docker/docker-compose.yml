version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: plumbingpro-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: plumbingpro
      POSTGRES_USER: plumb_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plumb_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumb_user -d plumbingpro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plumbnet

  redis:
    image: redis:7-alpine
    container_name: plumbingpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plumbnet

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: plumbingpro-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://plumb_user:${DB_PASSWORD:-plumb_password}@postgres:5432/plumbingpro
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
    networks:
      - plumbnet

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: plumbingpro-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - plumbnet

  nginx:
    image: nginx:1.27-alpine
    container_name: plumbingpro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - plumbnet

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  plumbnet:
    driver: bridge
